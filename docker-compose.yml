version: "3.9"

services:
  website-gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: website-gateway-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "55590:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
