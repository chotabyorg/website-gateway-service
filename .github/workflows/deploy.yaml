name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: chotabyorg/gitops/.github/workflows/reusable-deploy.yaml@main
    with:
      service: website-gateway-service
      gitops_repo: chotabyorg/gitops
      # Stage the published image for exact-candidate review before prod promotion.
      gitops_branch: releases/website-gateway-service
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
